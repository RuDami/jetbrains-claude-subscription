name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # No IDE on the runner, so the build falls back to the published platform artifact.
      - run: ./gradlew test buildPlugin --stacktrace

      # The same check JetBrains runs when a plugin is uploaded.
      - run: ./gradlew verifyPlugin --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
