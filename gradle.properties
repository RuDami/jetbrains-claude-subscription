# The build uses a locally installed IDE when it finds one and downloads the published
# platform otherwise, so nothing here is required. Set this only to point at a specific
# install — a non-standard location, or one of several IDEs.
#
# platformLocalPath=/Applications/WebStorm.app/Contents

# The platform already provides the Kotlin stdlib — a second copy in the plugin jar causes
# classloader conflicts at runtime.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true
