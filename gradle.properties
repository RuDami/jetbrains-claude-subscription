# Both paths below are discovered automatically in build.gradle.kts — a local JetBrains IDE
# for the platform, and the AI Assistant plugin under an IDE config directory. Uncomment and
# set them only when the guess is wrong (a non-standard install location, or several IDEs
# where the newest is not the one you build against).
#
# platformLocalPath=/Applications/WebStorm.app/Contents
# aiAssistantPluginPath=/path/to/JetBrains/WebStorm2026.2/plugins/ml-llm

# The platform already provides the Kotlin stdlib — a second copy in the plugin jar causes
# classloader conflicts at runtime.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.parallel=true
